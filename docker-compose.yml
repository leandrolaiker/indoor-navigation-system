version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: interior-map-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  backend:
    build:
      context: ./backend
    container_name: interior-map-backend
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      PORT: 3000
      MONGODB_URI: mongodb://mongo:27017/interior-maps
      UPLOADS_DIR: uploads
      GENERATED_DIR: generated
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/generated:/app/generated
    ports:
      - '3000:3000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3000
    container_name: interior-map-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '5173:80'

volumes:
  mongo_data:
